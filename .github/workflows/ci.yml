name: ZeroPhish CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Gitleaks Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret scanner
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-test:
    name: Backend Tests, Migrations & Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.13
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
          python -m pip install pytest pytest-asyncio pytest-cov httpx

      - name: Verify database migrations & schema parity
        env:
          DATABASE_URL: sqlite:///./ci_migration_test.db
        run: |
          python -m alembic -c alembic.ini upgrade head
          python -m alembic -c alembic.ini check
          rm -f ci_migration_test.db

      - name: Run backend test suite
        env:
          ENV: testing
          ADMIN_PASSWORD: TestAdmin@CI123
          GEMINI_API_KEY: placeholder_key_for_ci
          ZEROPHISH_VERSION: 1.0.0-ci
          GIT_COMMIT_SHA: ${{ github.sha }}
        run: |
          python -m pytest tests/ -v --cov=. --cov-report=xml --cov-report=term-missing

      - name: Enforce coverage threshold
        run: python -m coverage report --fail-under=65

      - name: Upload coverage report
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: always()
        with:
          name: backend-coverage
          path: Backend/coverage.xml

  backend-audit:
    name: Backend Dependency Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.13
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Audit dependencies for known vulnerabilities
        run: python -m pip_audit -r requirements.txt --ignore-vuln PYSEC-2022-43059

  frontend-ci:
    name: Frontend Typecheck, Vitest & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9

      - name: Set up Node.js 20 with pnpm cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        run: pnpm exec tsc --noEmit

      - name: Execute Vitest unit test suite
        run: pnpm test

      - name: Run ESLint
        run: pnpm lint

      - name: Build production bundle
        env:
          NEXT_PUBLIC_GATEWAY_URL: http://localhost:8001
        run: pnpm build

      - name: Audit frontend dependencies
        run: pnpm audit --audit-level=high

  extension-ci:
    name: Chrome Extension Validate & Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate manifest JSON
        run: |
          python3 -c "import json; d=json.load(open('extension/manifest.json')); assert d.get('manifest_version') == 3; print('Manifest v3 valid:', d.get('name'))"

      - name: Package extension bundle
        run: |
          cd extension
          zip -r ../zerophish-extension-${{ github.sha }}.zip . -x "*.git*"

      - name: Upload immutable extension artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: zerophish-extension-${{ github.sha }}
          path: zerophish-extension-*.zip
          retention-days: 14

  container-verify:
    name: Container Build Verification
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-ci]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build backend production image (verification only)
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          push: false
          tags: zerophish/backend:${{ github.sha }}

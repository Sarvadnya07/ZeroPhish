name: ZeroPhish CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Security Kernel Rule 20: Explicit top-level least privilege for GITHUB_TOKEN
permissions:
  contents: read

jobs:
  # ── Backend: pytest + coverage ─────────────────────────────────────────────
  backend-test:
    name: Backend Tests & Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.13
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # Exclude heavy GPU packages (torch/transformers) on standard CI runner if needed
          pip install $(grep -v '^#\|^torch\|^transformers\|^sentencepiece' requirements.txt | grep -v '^$')
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run test suite
        env:
          ENV: testing
          ADMIN_PASSWORD: TestAdmin@CI123
          GEMINI_API_KEY: placeholder_key_for_ci
        run: |
          python -m pytest tests/ -v --cov=. --cov-report=xml --cov-report=term-missing

      - name: Enforce coverage threshold
        run: |
          python -m coverage report --fail-under=59

      - name: Upload coverage report
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: always()
        with:
          name: backend-coverage
          path: coverage.xml

  # ── Backend: security audit ────────────────────────────────────────────────
  backend-audit:
    name: Backend Dependency Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.13
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies for known CVEs
        run: |
          pip-audit -r requirements.txt --ignore-vuln PYSEC-2022-43059

  # ── Frontend: TypeScript type check + build ────────────────────────────────
  frontend-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 20
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832e0b1 # v4.2.0
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f27602971fbe5ea20f5 # v4.1.0
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Build production bundle
        env:
          NEXT_PUBLIC_GATEWAY_URL: http://localhost:8001
        run: pnpm build

  # ── Extension: lint check ──────────────────────────────────────────────────
  extension-lint:
    name: Chrome Extension Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate manifest JSON
        run: |
          python3 -c "import json; d=json.load(open('extension/manifest.json')); assert d.get('manifest_version') == 3; print('Manifest v3 valid:', d.get('name'))"

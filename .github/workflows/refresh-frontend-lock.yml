name: Refresh Frontend Lockfile

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.head_commit.message != 'chore: refresh frontend lockfile'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: Frontend/pnpm-lock.yaml

      - name: Regenerate lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Restore frozen-lockfile CI
        working-directory: .
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path(".github/workflows/ci.yml")
          s = p.read_text()
          s = s.replace(
              "      # The existing lockfile predates the patched Next.js release. Resolve it\n"
              "      # from package.json so CI tests the declared, patched dependency graph.\n"
              "      # A lockfile refresh should be committed separately once generated locally.\n"
              "      - name: Install dependencies\n"
              "        run: pnpm install --no-frozen-lockfile",
              "      - name: Install dependencies\n"
              "        run: pnpm install --frozen-lockfile"
          )
          p.write_text(s)
          PY
          git rm .github/workflows/refresh-frontend-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Frontend/pnpm-lock.yaml .github/workflows/ci.yml
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh frontend lockfile"
          git push
